services:
  api:
    build:
      context: .
      target: api-runtime
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://chess:chess@db:5432/chess?sslmode=disable
      - JWT_SECRET=development-secret-key
    restart: always

  worker:
    build:
      context: .
      target: worker-runtime
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - api
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=chess
      - POSTGRES_PASSWORD=chess
      - POSTGRES_DB=chess
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
