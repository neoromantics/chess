services:
  api:
    build:
      context: .
      target: api-runtime
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - DB_PATH=/app/data/chess.db
      - JWT_SECRET=development-secret-key
    restart: always

  worker:
    build:
      context: .
      target: worker-runtime
    environment:
      - REDIS_URL=redis:6379 # Prepared for future queue support
    depends_on:
      - api
    restart: always

  # Placeholder for Phase 2 scaling infrastructure
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
