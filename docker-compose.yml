# ==============================================================================
# NOTICE: This docker-compose.yml is maintained STRICTLY as a local development 
# reference and testing environment to ensure parity. It is NOT intended for VM 
# or production deployments. Production relies on idiomatic K8s/Kustomize.
# ==============================================================================
services:
  # --- MICROSERVICES (Event-Driven) ---
  gateway:
    build:
      context: .
      target: gateway-runtime
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - USER_SERVICE_URL=http://user-service:8081
    restart: always

  user-service:
    build:
      context: .
      target: user-runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  game-service:
    build:
      context: .
      target: game-runtime
    depends_on:
      - redis
      - db
    environment:
      - REDIS_URL=redis:6379
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    restart: always

  matchmaker:
    build:
      context: .
      target: matchmaker-runtime
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis:6379
    restart: always

  engine-worker:
    build:
      context: .
      target: worker-runtime
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    restart: always

  # --- INFRASTRUCTURE ---
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always


