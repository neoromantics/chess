<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chess</title>
<style>
  :root { --sq: 112px; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #1e1e1e; color: #ddd; margin: 0; padding: 32px 20px; display: flex; gap: 32px; align-items: flex-start; justify-content: center; min-height: 100vh; }
  #board-wrap { display: inline-block; border: 4px solid #333; }
  #board { display: grid; grid-template-columns: repeat(8, var(--sq)); grid-template-rows: repeat(8, var(--sq)); position: relative; }
  .sq { width: var(--sq); height: var(--sq); display: flex; align-items: center; justify-content: center; font-size: calc(var(--sq) * 0.78); cursor: pointer; user-select: none; position: relative; line-height: 1; }
  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }
  .sel   { box-shadow: inset 0 0 0 4px #ffe066; }
  .last  { background: #cdd26a !important; }
  .check { box-shadow: inset 0 0 0 4px #ff4d4d; }
  .hint  { box-shadow: inset 0 0 0 5px #4ec77a; }
  .touched { box-shadow: inset 0 0 0 5px #ff8c1a; }
  #edit-panel { display: none; margin-top: 12px; padding: 10px; background: #2b2b2b; border-radius: 4px; }
  #edit-palette { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
  #edit-palette button { font-size: 28px; padding: 0; height: 40px; line-height: 1; background: #3a3a3a; }
  #edit-palette button.sel { background: #ffe066; color: #000; outline: 2px solid #ffe066; }
  body.editing #board .sq { cursor: crosshair; }
  .dot::before { content: ""; position: absolute; width: calc(var(--sq) * 0.34); height: calc(var(--sq) * 0.34); border-radius: 50%; background: rgba(0,0,0,0.25); }
  .cap::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; box-shadow: inset 0 0 0 6px rgba(20,20,20,0.35); }
  .white-piece { color: #fff; text-shadow: 0 0 1px #000, 0 0 2px #000, 1px 1px 1px #000; }
  .black-piece { color: #000; }
  #side { width: 320px; }
  h2, h3, h4 { margin: 12px 0 6px; }
  #status { font-size: 16px; font-weight: 600; margin-bottom: 14px; padding: 10px; background: #2b2b2b; border-radius: 4px; min-height: 22px; }
  .row { margin: 6px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select, button { background: #333; color: #ddd; border: 1px solid #555; padding: 6px 10px; border-radius: 3px; font: inherit; cursor: pointer; }
  button:hover, select:hover { background: #404040; }
  button#newgame { width: 100%; padding: 10px; margin-top: 8px; background: #2d5a2d; border-color: #3a703a; }
  button#newgame:hover { background: #357035; }
  #history { font-family: ui-monospace, Menlo, monospace; font-size: 13px; max-height: 280px; overflow-y: auto; background: #2b2b2b; padding: 8px 10px; border-radius: 3px; }
  #history div { line-height: 1.5; }
  #fen { font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-all; color: #888; background: #2b2b2b; padding: 6px 8px; border-radius: 3px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; }
  #modal.show { display: flex; }
  #promo { background: #2b2b2b; padding: 16px; border-radius: 6px; text-align: center; }
  #promo > div:first-child { margin-bottom: 8px; }
  #promo button { font-size: 40px; padding: 8px 14px; margin: 4px; line-height: 1; }
  .coords-files, .coords-ranks { color: #888; font-size: 12px; user-select: none; }
  .coords-files { display: grid; grid-template-columns: repeat(8, var(--sq)); padding-left: 22px; }
  .coords-files div { text-align: center; padding: 4px 0; }
  .board-row { display: flex; align-items: center; }
  .coords-ranks { display: grid; grid-template-rows: repeat(8, var(--sq)); width: 22px; }
  .coords-ranks div { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div id="board-wrap">
    <div class="board-row">
      <div class="coords-ranks" id="ranks"></div>
      <div id="board"></div>
    </div>
    <div class="coords-files" id="files"></div>
  </div>

  <div id="side">
    <h2 style="margin-top:0">chess</h2>
    <div id="status">Loading…</div>
    <div class="row"><label>White</label>
      <select id="white"><option value="h">Human</option><option value="e">Engine</option></select>
    </div>
    <div class="row"><label>Black</label>
      <select id="black"><option value="h">Human</option><option value="e" selected>Engine</option></select>
    </div>
    <div class="row"><label>White think</label>
      <select id="movetime-w">
        <option value="100">0.1s (weak)</option>
        <option value="300">0.3s</option>
        <option value="1000" selected>1s</option>
        <option value="3000">3s</option>
        <option value="10000">10s (strong)</option>
      </select>
    </div>
    <div class="row"><label>Black think</label>
      <select id="movetime-b">
        <option value="100">0.1s (weak)</option>
        <option value="300">0.3s</option>
        <option value="1000" selected>1s</option>
        <option value="3000">3s</option>
        <option value="10000">10s (strong)</option>
      </select>
    </div>
    <div class="row" title="Tournament rule: clicking a piece commits you to moving it. Clicking a piece with no legal moves loses the game."><label>Touch-move</label>
      <input type="checkbox" id="touchmove">
    </div>
    <div class="row" title="After each move you make, the engine evaluates how good it was."><label>Assess my moves</label>
      <input type="checkbox" id="autoassess">
    </div>
    <button id="newgame">New Game</button>
    <div class="row" style="margin-top:8px; gap: 6px;">
      <button id="hint" style="flex:1; background:#2d4a5a; border-color:#3a6075;">Hint</button>
      <button id="assess" style="flex:1; background:#4a2d5a; border-color:#603a75;">Assess</button>
      <button id="edit-mode" style="flex:1; background:#5a4a2d; border-color:#75603a;">Edit</button>
    </div>
    <div class="row" style="margin-top:6px; gap: 6px;">
      <button id="save" style="flex:1">Save</button>
      <button id="load" style="flex:1">Load</button>
      <input type="file" id="load-file" accept="application/json,.json" style="display:none">
    </div>
    <div id="hint-info" style="margin-top:6px; min-height:18px; color:#9fdcb5; font-size:13px; font-family: ui-monospace, Menlo, monospace;"></div>
    <div id="assess-info" style="margin-top:4px; min-height:18px; font-size:13px; font-family: ui-monospace, Menlo, monospace;"></div>
    <div class="row" style="margin-top:6px; gap: 6px;">
      <input type="text" id="fen-input" placeholder="paste FEN…" style="flex:1; background:#2b2b2b; color:#ddd; border:1px solid #555; padding:6px 8px; border-radius:3px; font:inherit;">
      <button id="load-fen">Load FEN</button>
    </div>
    <h3>Moves</h3>
    <div id="history"></div>
    <h4>FEN</h4>
    <div id="fen"></div>

    <div id="edit-panel">
      <div style="font-weight:600; margin-bottom: 6px;">Edit Position</div>
      <div style="font-size:12px; color:#aaa;">Pick a piece, click squares to place. Right-click a square to remove.</div>
      <div id="edit-palette"></div>
      <div class="row"><label>Turn</label>
        <select id="edit-turn"><option value="w">White</option><option value="b">Black</option></select>
      </div>
      <div class="row"><label>Castling</label>
        <span style="font-family: ui-monospace, Menlo, monospace;">
          <label><input type="checkbox" id="cKW"> K</label>
          <label><input type="checkbox" id="cQW"> Q</label>
          <label><input type="checkbox" id="cKB"> k</label>
          <label><input type="checkbox" id="cQB"> q</label>
        </span>
      </div>
      <div class="row" style="margin-top:8px; gap:6px;">
        <button id="edit-clear" style="flex:1">Clear</button>
        <button id="edit-startpos" style="flex:1">Start Pos</button>
      </div>
      <div class="row" style="margin-top:6px; gap:6px;">
        <button id="edit-apply" style="flex:1; background:#2d5a2d; border-color:#3a703a;">Apply</button>
        <button id="edit-cancel" style="flex:1">Cancel</button>
      </div>
    </div>
  </div>

  <div id="modal">
    <div id="promo">
      <div>Promote to:</div>
      <div id="promo-buttons"></div>
    </div>
  </div>

<script>
const PIECE = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',
               k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

let state = null;
let selected = null;
let pendingPromo = null;
let enginePending = false;
let hint = null; // {from, to} of engine's suggested move, or null

// Board editor state ------------------------------------------------------
let editMode = false;
let editBoard = null; // 8x8 grid; editBoard[0] is rank 8. null = empty
let editPalette = '.'; // current palette selection: piece char or '.' for empty
let editTurn = 'w';
let editCastling = { KW: true, QW: true, KB: true, QB: true };
const PALETTE_PIECES = ['K','Q','R','B','N','P','k','q','r','b','n','p'];

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const historyEl = document.getElementById('history');
const fenEl = document.getElementById('fen');
const modalEl = document.getElementById('modal');

(function buildCoords(){
  const files = document.getElementById('files');
  for (let f = 0; f < 8; f++) {
    const d = document.createElement('div');
    d.textContent = String.fromCharCode(97+f);
    files.appendChild(d);
  }
  const ranks = document.getElementById('ranks');
  for (let r = 8; r >= 1; r--) {
    const d = document.createElement('div');
    d.textContent = r;
    ranks.appendChild(d);
  }
})();

function parseBoard(fen) {
  const rows = fen.split(' ')[0].split('/');
  const grid = [];
  for (const row of rows) {
    const arr = [];
    for (const ch of row) {
      if (ch >= '1' && ch <= '8') {
        for (let i = 0; i < parseInt(ch); i++) arr.push(null);
      } else {
        arr.push(ch);
      }
    }
    grid.push(arr);
  }
  return grid; // grid[0] is rank 8
}

function render() {
  if (!state) return;
  if (editMode) { renderEdit(); return; }
  const grid = parseBoard(state.fen);
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = document.createElement('div');
      const dark = (r + f) % 2 === 1;
      sq.className = 'sq ' + (dark ? 'dark' : 'light');
      const fileChar = String.fromCharCode(97+f);
      const rankChar = String.fromCharCode(49+(7-r));
      const name = fileChar + rankChar;
      sq.dataset.sq = name;
      const pc = grid[r][f];
      if (pc) {
        const span = document.createElement('span');
        span.textContent = PIECE[pc];
        span.className = (pc === pc.toUpperCase()) ? 'white-piece' : 'black-piece';
        sq.appendChild(span);
      }
      if (state.last_move && (state.last_move.from === name || state.last_move.to === name)) {
        sq.classList.add('last');
      }
      const sel = state.touch_move ? state.touched_square : selected;
      if (state.touch_move && state.touched_square === name) sq.classList.add('touched');
      else if (!state.touch_move && selected === name) sq.classList.add('sel');
      if (sel) {
        const moves = state.legal_moves.filter(m => m.startsWith(sel) && m.substring(2,4) === name);
        if (moves.length) sq.classList.add(pc ? 'cap' : 'dot');
      }
      if (state.in_check) {
        const isOurKing = pc && ((state.turn === 'w' && pc === 'K') || (state.turn === 'b' && pc === 'k'));
        if (isOurKing) sq.classList.add('check');
      }
      if (hint && (hint.from === name || hint.to === name)) sq.classList.add('hint');
      sq.onclick = () => onSquare(name);
      boardEl.appendChild(sq);
    }
  }

  let s;
  if (state.status === 'checkmate') {
    s = 'Checkmate — ' + (state.turn === 'w' ? 'Black' : 'White') + ' wins';
  } else if (state.status === 'stalemate') {
    s = 'Stalemate — draw';
  } else if (state.status === 'draw50') {
    s = 'Draw — 50-move rule';
  } else if (state.status === 'draw_repetition') {
    s = 'Draw — threefold repetition';
  } else if (state.status === 'draw_insufficient') {
    s = 'Draw — insufficient material';
  } else if (state.status === 'touch_lost') {
    s = 'Touch-move loss — ' + (state.turn === 'w' ? 'Black' : 'White') + ' wins';
  } else {
    s = (state.turn === 'w' ? 'White' : 'Black') + ' to move';
    if (state.thinking) s += '  (engine thinking…)';
    else if (state.engine_to_move) s += '  (engine’s turn)';
    if (state.in_check) s += ' — check!';
  }
  statusEl.textContent = s;

  historyEl.innerHTML = '';
  for (let i = 0; i < state.history.length; i += 2) {
    const div = document.createElement('div');
    const moveNum = (i/2) + 1;
    div.appendChild(document.createTextNode(moveNum + '. '));
    if (state.history[i])   div.appendChild(makeMoveSpan(state.history[i],   i));
    if (state.history[i+1]) { div.appendChild(document.createTextNode('  ')); div.appendChild(makeMoveSpan(state.history[i+1], i+1)); }
    historyEl.appendChild(div);
  }
  fenEl.textContent = state.fen;

  document.getElementById('white').value = state.engine_white ? 'e' : 'h';
  document.getElementById('black').value = state.engine_black ? 'e' : 'h';
  document.getElementById('touchmove').checked = state.touch_move;
}

async function onSquare(name) {
  if (state.thinking || state.engine_to_move || state.status !== 'ongoing') return;

  // Touch-move flow: server commits the touch and may declare a loss.
  if (state.touch_move) {
    const touched = state.touched_square;
    if (touched) {
      // Already touched — this click must be a destination of the touched piece.
      const cands = state.legal_moves.filter(m => m.substring(0,2) === touched && m.substring(2,4) === name);
      if (!cands.length) return; // ignore non-destination clicks
      if (cands.length === 1 && cands[0].length === 4) {
        sendMove(cands[0]);
      } else {
        pendingPromo = { from: touched, to: name };
        showPromo();
      }
      return;
    }
    // Nothing touched yet — try to touch this square (server will validate / lose).
    const r = await fetch('/api/touch', {method: 'POST', body: JSON.stringify({square: name})});
    state = await r.json();
    render();
    return;
  }

  // Standard click-to-select / click-to-move flow.
  if (selected === name) { selected = null; render(); return; }
  const startsHere = state.legal_moves.some(m => m.startsWith(name));
  if (startsHere) { selected = name; render(); return; }
  if (selected) {
    const cands = state.legal_moves.filter(m => m.substring(0,2) === selected && m.substring(2,4) === name);
    if (!cands.length) { selected = null; render(); return; }
    if (cands.length === 1 && cands[0].length === 4) {
      const mv = cands[0];
      selected = null;
      sendMove(mv);
    } else {
      pendingPromo = { from: selected, to: name };
      selected = null;
      showPromo();
    }
  }
}

function clearHint() {
  hint = null;
  document.getElementById('hint-info').textContent = '';
}

const ASSESS_COLORS = {
  Brilliant:  '#9bf6a6',
  Best:       '#9fdcb5',
  Excellent:  '#9fdcb5',
  Good:       '#bcd0a3',
  Inaccuracy: '#e6c875',
  Mistake:    '#e6a075',
  Blunder:    '#ff7575',
};
const ASSESS_SYMBOL = {
  Brilliant:  '!!',
  Best:       '',
  Excellent:  '',
  Good:       '',
  Inaccuracy: '?!',
  Mistake:    '?',
  Blunder:    '??',
};
let assessments = {}; // index -> assessResponse

function showAssess(data) {
  const el = document.getElementById('assess-info');
  if (!data) { el.textContent = ''; return; }
  const color = ASSESS_COLORS[data.label] || '#ddd';
  let txt = `${data.move}: ${data.label}`;
  if (data.label !== 'Best' && data.label !== 'Brilliant') {
    txt += `  (-${data.cp_loss}cp; best ${data.best_move})`;
  } else if (data.label === 'Brilliant') {
    txt += `  (+${-data.cp_loss}cp vs engine pick ${data.best_move})`;
  } else {
    txt += `  (${data.user_score})`;
  }
  el.textContent = txt;
  el.style.color = color;
}

async function runAssess(index) {
  // Assess uses the side-to-move's think time, capped so analysis stays snappy.
  const movetime = Math.min(thinkTimeFor(state.turn), 800);
  showAssess(null);
  document.getElementById('assess-info').textContent = 'assessing…';
  document.getElementById('assess-info').style.color = '#888';
  const body = (index === undefined) ? {movetime} : {movetime, index};
  try {
    const r = await fetch('/api/assess', {method: 'POST', body: JSON.stringify(body)});
    if (!r.ok) {
      document.getElementById('assess-info').textContent = '';
      return null;
    }
    const a = await r.json();
    assessments[a.index] = a;
    render(); // refresh history annotations
    return a;
  } catch (e) {
    document.getElementById('assess-info').textContent = '';
    return null;
  }
}

function makeMoveSpan(mv, idx) {
  const span = document.createElement('span');
  span.textContent = mv;
  span.style.cursor = 'pointer';
  span.style.padding = '0 3px';
  span.style.borderRadius = '2px';
  span.title = 'Click to assess this move';
  span.onmouseenter = () => span.style.background = '#3a3a3a';
  span.onmouseleave = () => span.style.background = 'transparent';
  span.onclick = async () => {
    const a = await runAssess(idx);
    if (a) showAssess(a);
  };
  const a = assessments[idx];
  if (a && ASSESS_SYMBOL[a.label]) {
    const sup = document.createElement('span');
    sup.textContent = ASSESS_SYMBOL[a.label];
    sup.style.color = ASSESS_COLORS[a.label];
    sup.style.fontWeight = 'bold';
    sup.style.marginLeft = '1px';
    span.appendChild(sup);
  }
  return span;
}

async function sendMove(mv) {
  clearHint();
  showAssess(null);
  const r = await fetch('/api/move', {method: 'POST', body: JSON.stringify({move: mv})});
  state = await r.json();
  render();
  if (document.getElementById('autoassess').checked) {
    const a = await runAssess();
    if (a) showAssess(a);
  }
  scheduleEngine();
}

document.getElementById('assess').onclick = async () => {
  if (!state || state.thinking) return;
  const a = await runAssess();
  if (a) showAssess(a);
};

document.getElementById('hint').onclick = async () => {
  if (!state || state.thinking || state.status !== 'ongoing') return;
  const btn = document.getElementById('hint');
  const info = document.getElementById('hint-info');
  btn.disabled = true;
  info.textContent = 'thinking…';
  // optimistic: show "engine thinking" in status while we wait
  state.thinking = true;
  render();
  const movetime = thinkTimeFor(state.turn);
  try {
    const r = await fetch('/api/hint', {method: 'POST', body: JSON.stringify({movetime})});
    if (!r.ok) {
      info.textContent = '';
      alert('Hint failed: ' + await r.text());
      return;
    }
    const data = await r.json();
    state = data.state;
    if (data.hint) {
      hint = { from: data.hint.from, to: data.hint.to };
      const promoStr = data.hint.promo ? '=' + data.hint.promo.toUpperCase() : '';
      info.textContent = `Hint: ${data.hint.from}→${data.hint.to}${promoStr}  (${data.hint.score}, depth ${data.hint.depth})`;
    } else {
      hint = null;
      info.textContent = 'No move available.';
    }
    render();
  } finally {
    btn.disabled = false;
  }
};

function thinkTimeFor(side) {
  return parseInt(document.getElementById('movetime-' + side).value);
}

function scheduleEngine() {
  if (!state || state.status !== 'ongoing') return;
  if (!state.engine_to_move) return;
  if (enginePending) return;
  enginePending = true;
  // Render once with thinking=true so status updates immediately.
  state.thinking = true;
  render();
  const movetime = thinkTimeFor(state.turn);
  fetch('/api/engine_step', {method: 'POST', body: JSON.stringify({movetime})})
    .then(r => r.json())
    .then(s => {
      state = s;
      enginePending = false;
      render();
      scheduleEngine(); // chain for engine-vs-engine
    })
    .catch(err => {
      enginePending = false;
      console.error(err);
    });
}

function showPromo() {
  const buttons = document.getElementById('promo-buttons');
  buttons.innerHTML = '';
  const isWhite = state.turn === 'w';
  const opts = [
    ['q', isWhite ? '♕' : '♛'],
    ['r', isWhite ? '♖' : '♜'],
    ['b', isWhite ? '♗' : '♝'],
    ['n', isWhite ? '♘' : '♞'],
  ];
  for (const [letter, ch] of opts) {
    const btn = document.createElement('button');
    btn.textContent = ch;
    btn.className = isWhite ? 'white-piece' : 'black-piece';
    btn.onclick = () => {
      modalEl.classList.remove('show');
      const mv = pendingPromo.from + pendingPromo.to + letter;
      pendingPromo = null;
      sendMove(mv);
    };
    buttons.appendChild(btn);
  }
  modalEl.classList.add('show');
}

// ---- Board editor -----------------------------------------------------

function renderEdit() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = document.createElement('div');
      const dark = (r + f) % 2 === 1;
      sq.className = 'sq ' + (dark ? 'dark' : 'light');
      const pc = editBoard[r][f];
      if (pc) {
        const span = document.createElement('span');
        span.textContent = PIECE[pc];
        span.className = (pc === pc.toUpperCase()) ? 'white-piece' : 'black-piece';
        sq.appendChild(span);
      }
      sq.onclick = () => {
        editBoard[r][f] = (editPalette === '.') ? null : editPalette;
        renderEdit();
      };
      sq.oncontextmenu = (e) => {
        e.preventDefault();
        editBoard[r][f] = null;
        renderEdit();
      };
      boardEl.appendChild(sq);
    }
  }
  statusEl.textContent = 'Editing position — click squares to place; right-click to remove';
}

function buildPalette() {
  const el = document.getElementById('edit-palette');
  el.innerHTML = '';
  for (const ch of PALETTE_PIECES) {
    const b = document.createElement('button');
    b.textContent = PIECE[ch];
    b.classList.add(ch === ch.toUpperCase() ? 'white-piece' : 'black-piece');
    if (editPalette === ch) b.classList.add('sel');
    b.onclick = () => { editPalette = ch; buildPalette(); };
    el.appendChild(b);
  }
  const trash = document.createElement('button');
  trash.textContent = '×';
  trash.title = 'Empty';
  if (editPalette === '.') trash.classList.add('sel');
  trash.onclick = () => { editPalette = '.'; buildPalette(); };
  el.appendChild(trash);
}

function enterEditMode() {
  editMode = true;
  editBoard = parseBoard(state.fen);
  const parts = state.fen.split(' ');
  editTurn = parts[1] || 'w';
  const ca = parts[2] || '-';
  editCastling = { KW: ca.includes('K'), QW: ca.includes('Q'),
                   KB: ca.includes('k'), QB: ca.includes('q') };
  editPalette = 'P';
  document.getElementById('edit-panel').style.display = 'block';
  document.body.classList.add('editing');
  document.getElementById('edit-mode').textContent = 'Editing…';
  document.getElementById('edit-turn').value = editTurn;
  document.getElementById('cKW').checked = editCastling.KW;
  document.getElementById('cQW').checked = editCastling.QW;
  document.getElementById('cKB').checked = editCastling.KB;
  document.getElementById('cQB').checked = editCastling.QB;
  buildPalette();
  render();
}

function exitEditMode() {
  editMode = false;
  editBoard = null;
  document.getElementById('edit-panel').style.display = 'none';
  document.body.classList.remove('editing');
  document.getElementById('edit-mode').textContent = 'Edit Position';
  render();
}

document.getElementById('edit-mode').onclick = () => {
  if (editMode) exitEditMode(); else enterEditMode();
};
document.getElementById('edit-cancel').onclick = exitEditMode;
document.getElementById('edit-clear').onclick = () => {
  editBoard = Array.from({length: 8}, () => Array(8).fill(null));
  renderEdit();
};
document.getElementById('edit-startpos').onclick = () => {
  editBoard = parseBoard("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR");
  renderEdit();
};
document.getElementById('edit-turn').onchange = e => { editTurn = e.target.value; };
['KW','QW','KB','QB'].forEach(k => {
  document.getElementById('c' + k).onchange = e => { editCastling[k] = e.target.checked; };
});

function findOne(piece) {
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    if (editBoard[r][f] === piece) return { r, f };
  }
  return null;
}

document.getElementById('edit-apply').onclick = async () => {
  // Build FEN board field.
  let board = '';
  for (let r = 0; r < 8; r++) {
    let empty = 0, row = '';
    for (let f = 0; f < 8; f++) {
      const pc = editBoard[r][f];
      if (!pc) { empty++; }
      else { if (empty) { row += empty; empty = 0; } row += pc; }
    }
    if (empty) row += empty;
    board += row;
    if (r < 7) board += '/';
  }
  // Strip castling rights that don't match king/rook positions, so we never
  // hand the engine a contradiction.
  const wK = findOne('K'), bK = findOne('k');
  const has = (piece, r, f) => editBoard[r] && editBoard[r][f] === piece;
  const valid = {
    KW: editCastling.KW && wK && wK.r === 7 && wK.f === 4 && has('R', 7, 7),
    QW: editCastling.QW && wK && wK.r === 7 && wK.f === 4 && has('R', 7, 0),
    KB: editCastling.KB && bK && bK.r === 0 && bK.f === 4 && has('r', 0, 7),
    QB: editCastling.QB && bK && bK.r === 0 && bK.f === 4 && has('r', 0, 0),
  };
  let castling = '';
  if (valid.KW) castling += 'K';
  if (valid.QW) castling += 'Q';
  if (valid.KB) castling += 'k';
  if (valid.QB) castling += 'q';
  if (!castling) castling = '-';

  const fen = `${board} ${editTurn} ${castling} - 0 1`;
  const w = document.getElementById('white').value === 'e';
  const b = document.getElementById('black').value === 'e';
  const r = await fetch('/api/load', {method: 'POST', body: JSON.stringify({start_fen: fen, moves: [], engine_white: w, engine_black: b})});
  if (!r.ok) {
    alert('Apply failed: ' + await r.text());
    return;
  }
  state = await r.json();
  selected = null;
  clearHint();
  exitEditMode();
  scheduleEngine();
};

// ---- end editor -------------------------------------------------------

async function applyPlayerSelectors() {
  const w = document.getElementById('white').value === 'e';
  const b = document.getElementById('black').value === 'e';
  const r = await fetch('/api/set_players', {method: 'POST', body: JSON.stringify({engine_white: w, engine_black: b})});
  if (!r.ok) { alert('Switch failed: ' + await r.text()); return; }
  state = await r.json();
  selected = null;
  render();
  scheduleEngine(); // newly-assigned engine takes over if it's now its turn
}
document.getElementById('white').onchange = applyPlayerSelectors;
document.getElementById('black').onchange = applyPlayerSelectors;

document.getElementById('touchmove').onchange = async (e) => {
  const r = await fetch('/api/touch_move', {method: 'POST', body: JSON.stringify({enabled: e.target.checked})});
  state = await r.json();
  selected = null;
  clearHint();
  showAssess(null);
  assessments = {};
  render();
};

document.getElementById('save').onclick = () => {
  window.location.href = '/api/save';
};

document.getElementById('load').onclick = () => {
  document.getElementById('load-file').click();
};

document.getElementById('load-file').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const text = await file.text();
  try { JSON.parse(text); } catch (err) { alert('Not a valid JSON file'); return; }
  const r = await fetch('/api/load', {method: 'POST', body: text});
  if (!r.ok) { alert('Load failed: ' + await r.text()); return; }
  state = await r.json();
  selected = null;
  clearHint();
  showAssess(null);
  assessments = {};
  render();
  scheduleEngine();
};

document.getElementById('load-fen').onclick = async () => {
  const fen = document.getElementById('fen-input').value.trim();
  if (!fen) return;
  const w = document.getElementById('white').value === 'e';
  const b = document.getElementById('black').value === 'e';
  const r = await fetch('/api/load', {method: 'POST', body: JSON.stringify({start_fen: fen, moves: [], engine_white: w, engine_black: b})});
  if (!r.ok) { alert('Load failed: ' + await r.text()); return; }
  state = await r.json();
  selected = null;
  clearHint();
  document.getElementById('fen-input').value = '';
  render();
  scheduleEngine();
};

document.getElementById('newgame').onclick = async () => {
  const w = document.getElementById('white').value === 'e';
  const b = document.getElementById('black').value === 'e';
  const r = await fetch('/api/new', {method: 'POST', body: JSON.stringify({engine_white: w, engine_black: b})});
  state = await r.json();
  selected = null;
  clearHint();
  showAssess(null);
  assessments = {};
  render();
  scheduleEngine();
};

(async function init(){
  const r = await fetch('/api/state');
  state = await r.json();
  render();
  scheduleEngine();
})();
</script>
