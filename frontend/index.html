<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Icon discovery surface. Chrome's URL-bar autocomplete + bookmark
       UI prefer the manifest + apple-touch-icon over a bare <link rel="icon">,
       so providing all three is what gets our chess-knight SVG to win over
       whatever default Chrome may have cached from the dev server. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a1a1a">
  <title>chess</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
