metadata:
  name: chess-game-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-game-service
  template:
    metadata:
      labels:
        app: chess-game-service
    spec:
      containers:
      - name: game-service
        image: ghcr.io/neoromantics/chess/game-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-game-service
spec:
  selector:
    app: chess-game-service
  ports:
  - port: 80
    targetPort: 8080

