  name: chess-rating-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-rating-updater
  template:
    metadata:
      labels:
        app: chess-rating-updater
    spec:
      containers:
      - name: rating-updater
        image: ghcr.io/neoromantics/chess/rating-updater:latest
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: DATABASE_URL
