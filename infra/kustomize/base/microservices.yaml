---
# === ENGINE WORKER ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-worker
  template:
    metadata:
      labels:
        app: chess-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/neoromantics/chess/worker:latest
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        resources:
          requests:
            cpu: 1000m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 256Mi
