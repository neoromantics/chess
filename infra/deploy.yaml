---
# === POSTGRES ===
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-db
  template:
    metadata:
      labels:
        app: chess-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: chess-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-db
spec:
  selector:
    app: chess-db
  ports:
  - port: 5432
    targetPort: 5432
---
# === REDIS ===
# Single primary today. AOF persistence is enabled so a Redis restart
# loses ~1s of pub/sub events at worst, not minutes of queued engine
# requests. Sentinel/HA is a Phase 5 hardening task.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-redis-config
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    # Cap memory to avoid OOMKill on tournament-day surges; eviction
    # policy keeps the pub/sub keyspace warm and drops least-used state.
    maxmemory 200mb
    maxmemory-policy allkeys-lru
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-redis-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-redis
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC is RWO; rolling update would deadlock.
  selector:
    matchLabels:
      app: chess-redis
  template:
    metadata:
      labels:
        app: chess-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: chess-redis-config
      - name: data
        persistentVolumeClaim:
          claimName: chess-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-redis
spec:
  selector:
    app: chess-redis
  ports:
  - port: 6379
    targetPort: 6379
---
# === INGRESS WITH TLS ===
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chess-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: chess-redirect-https@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "chess_api_pod"
spec:
  tls:
  - hosts:
    - vcm-50800.vm.duke.edu
    secretName: chess-tls
  rules:
  - host: vcm-50800.vm.duke.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chess-gateway
            port:
              number: 80
---
# === HTTPS REDIRECT MIDDLEWARE ===
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# === GATEWAY ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-gateway
  template:
    metadata:
      labels:
        app: chess-gateway
    spec:
      containers:
      - name: gateway
        image: ghcr.io/neoromantics/chess/gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          value: chess-redis:6379
        - name: USER_SERVICE_URL
          value: http://chess-user-service:80
        - name: GAME_SERVICE_URL
          value: http://chess-game-service:80
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-gateway
spec:
  selector:
    app: chess-gateway
  ports:
  - port: 80
    targetPort: 8080

---
# === USER SERVICE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-user-service
  template:
    metadata:
      labels:
        app: chess-user-service
    spec:
      containers:
      - name: user-service
        image: ghcr.io/neoromantics/chess/user-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-db:5432/$(POSTGRES_DB)?sslmode=disable"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: JWT_SECRET
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-user-service
spec:
  selector:
    app: chess-user-service
  ports:
  - port: 80
    targetPort: 8081

---
# === GAME SERVICE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-game-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-game-service
  template:
    metadata:
      labels:
        app: chess-game-service
    spec:
      containers:
      - name: game-service
        image: ghcr.io/neoromantics/chess/game-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-db:5432/$(POSTGRES_DB)?sslmode=disable"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-game-service
spec:
  selector:
    app: chess-game-service
  ports:
  - port: 80
    targetPort: 8080

---
# === MATCHMAKER ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-matchmaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-matchmaker
  template:
    metadata:
      labels:
        app: chess-matchmaker
    spec:
      containers:
      - name: matchmaker
        image: ghcr.io/neoromantics/chess/matchmaker:latest
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-matchmaker
spec:
  selector:
    app: chess-matchmaker
  ports:
  - port: 80
    targetPort: 8080

---
# === RATING UPDATER ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-rating-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-rating-updater
  template:
    metadata:
      labels:
        app: chess-rating-updater
    spec:
      containers:
      - name: rating-updater
        image: ghcr.io/neoromantics/chess/rating-updater:latest
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-db:5432/$(POSTGRES_DB)?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: chess-rating-updater
spec:
  selector:
    app: chess-rating-updater
  ports:
  - port: 80
    targetPort: 8080

---
# === ENGINE WORKER ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-worker
  template:
    metadata:
      labels:
        app: chess-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/neoromantics/chess/worker:latest
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        resources:
          requests:
            cpu: 1000m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 256Mi
