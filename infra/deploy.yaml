---
# ==============================================================================
# 1. PERSISTENCE LAYER (Postgres & Redis)
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-db
  template:
    metadata:
      labels:
        app: chess-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: chess-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-db
spec:
  selector:
    app: chess-db
  ports:
  - port: 5432
    targetPort: 5432

---
# === PGBOUNCER (connection multiplexing) ===
# Without this, every service pod's sql.DB pool (MaxOpenConns=25)
# multiplied by replicas (6 services × ~2 replicas) creates ~300
# possible client connections against a Postgres whose default
# max_connections is 100. Under sustained load, services start getting
# "too many connections" and crash-loop.
#
# pgbouncer in transaction-pool mode multiplexes thousands of client
# connections into a handful of real Postgres backends. lib/pq + sqlc
# (emit_prepared_queries=false) are compatible with transaction pooling.
# Configuration is supplied via env vars (the edoburu image generates
# pgbouncer.ini + userlist.txt at boot from these), so there's no
# ConfigMap with the PG password sitting at rest unencrypted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-pgbouncer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chess-pgbouncer
  template:
    metadata:
      labels:
        app: chess-pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:1.23.1
        ports: [{containerPort: 5432}]
        env:
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DB_HOST
          value: chess-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: AUTH_TYPE
          value: md5
        - name: POOL_MODE
          value: transaction
        - name: MAX_CLIENT_CONN
          value: "1000"
        - name: DEFAULT_POOL_SIZE
          value: "25"
        - name: SERVER_RESET_QUERY
          value: DISCARD ALL
        - name: IGNORE_STARTUP_PARAMETERS
          value: extra_float_digits
        readinessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-pgbouncer
spec:
  selector:
    app: chess-pgbouncer
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-redis-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chess-redis
  template:
    metadata:
      labels:
        app: chess-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chess-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-redis
spec:
  selector:
    app: chess-redis
  ports:
  - port: 6379
    targetPort: 6379

# ==============================================================================
# 2. NETWORKING LAYER (Ingress & Gateway)
# ==============================================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chess-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: chess-redirect-https@kubernetescrd
spec:
  tls:
  - hosts: [vcm-50800.vm.duke.edu]
    secretName: chess-tls
  rules:
  - host: vcm-50800.vm.duke.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chess-gateway
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-gateway
  template:
    metadata:
      labels:
        app: chess-gateway
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: gateway
        image: ghcr.io/neoromantics/chess:latest
        command: ["./gateway"]
        ports: [{containerPort: 8080}]
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          value: chess-redis:6379
        - name: USER_SERVICE_URL
          value: http://chess-user-service:80
        - name: GAME_SERVICE_URL
          value: http://chess-game-service:80
        # Gateway runs auth.Middleware, so it MUST verify JWTs with the
        # same key user-service signs with. Without this env, loadSecret()
        # falls back to a random ephemeral key on each boot and every
        # auth-gated request 401s the moment a fresh user signs up.
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: chess-secrets, key: JWT_SECRET}}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chess-gateway
spec:
  selector:
    app: chess-gateway
  ports:
  - port: 80
    targetPort: 8080

# ==============================================================================
# 3. MICROSERVICES FLEET (Unified Platform Image)
# ==============================================================================

---
# USER SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-user-service
  template:
    metadata:
      labels:
        app: chess-user-service
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: user-service
        image: ghcr.io/neoromantics/chess:latest
        command: ["./user-service"]
        ports: [{containerPort: 8081}]
        env:
        - name: PORT
          value: "8081"
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_DB}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-pgbouncer:5432/$(POSTGRES_DB)?sslmode=disable"
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: chess-secrets, key: JWT_SECRET}}
        readinessProbe:
          httpGet: {path: /health, port: 8081}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-user-service
spec:
  selector:
    app: chess-user-service
  ports: [{port: 80, targetPort: 8081}]

---
# GAME SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-game-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-game-service
  template:
    metadata:
      labels:
        app: chess-game-service
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: game-service
        image: ghcr.io/neoromantics/chess:latest
        command: ["./game-service"]
        ports: [{containerPort: 8080}]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_DB}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-pgbouncer:5432/$(POSTGRES_DB)?sslmode=disable"
        readinessProbe:
          httpGet: {path: /health, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-game-service
spec:
  selector:
    app: chess-game-service
  ports: [{port: 80, targetPort: 8080}]

---
# MATCHMAKER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-matchmaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-matchmaker
  template:
    metadata:
      labels:
        app: chess-matchmaker
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: matchmaker
        image: ghcr.io/neoromantics/chess:latest
        command: ["./matchmaker"]
        ports: [{containerPort: 8080}]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        readinessProbe:
          httpGet: {path: /health, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-matchmaker
spec:
  selector:
    app: chess-matchmaker
  ports: [{port: 80, targetPort: 8080}]

---
# RATING UPDATER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-rating-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-rating-updater
  template:
    metadata:
      labels:
        app: chess-rating-updater
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: rating-updater
        image: ghcr.io/neoromantics/chess:latest
        command: ["./rating-updater"]
        ports: [{containerPort: 8080}]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_DB}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-pgbouncer:5432/$(POSTGRES_DB)?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: chess-rating-updater
spec:
  selector:
    app: chess-rating-updater
  ports: [{port: 80, targetPort: 8080}]

---
# ENGINE WORKER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-worker
  template:
    metadata:
      labels:
        app: chess-worker
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: worker
        image: ghcr.io/neoromantics/chess:latest
        command: ["./worker"]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        resources:
          requests: {cpu: 500m, memory: 256Mi}
          limits: {cpu: 1000m, memory: 512Mi}
