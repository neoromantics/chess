---
# ==============================================================================
# 1. PERSISTENCE LAYER (Postgres & Redis)
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-db
  template:
    metadata:
      labels:
        app: chess-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        # max_connections raised from PG default 100 to 500 so 6
        # services × 2 replicas × MaxOpenConns=25 = 300 client conns
        # fits comfortably. ~10MB RAM per connection, so 500 caps at
        # ~5GB — well within the chess-db pod's working set on a
        # modestly-sized node. If we ever need real connection
        # pooling, the right next move is to build our own pgbouncer
        # image (the dependency on external pgbouncer images was a
        # repeated tag-not-found footgun).
        args: ["-c", "max_connections=500"]
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: chess-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-db
spec:
  selector:
    app: chess-db
  ports:
  - port: 5432
    targetPort: 5432

---
# pgbouncer was removed after four failed deploy cycles chasing the
# right published Docker Hub tag (edoburu 1.23.0/1.23.1, bitnami 1.23.1,
# bitnami:latest — all returned manifest-not-found). At our actual
# scale (single VM, 6 services × 2 replicas × MaxOpenConns=25 = 300
# possible client conns), the simpler fix is the chess-db
# max_connections=500 setting above. When we cross 500 real conns
# (genuine multi-node, thousands of pods), the right move is to
# build our own pgbouncer image rather than depend on a published one.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-redis-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chess-redis
  template:
    metadata:
      labels:
        app: chess-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chess-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chess-redis
spec:
  selector:
    app: chess-redis
  ports:
  - port: 6379
    targetPort: 6379

# ==============================================================================
# 2. NETWORKING LAYER (Ingress & Gateway)
# ==============================================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chess-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: chess-redirect-https@kubernetescrd
spec:
  tls:
  - hosts: [vcm-50800.vm.duke.edu]
    secretName: chess-tls
  rules:
  - host: vcm-50800.vm.duke.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chess-gateway
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-gateway
  template:
    metadata:
      labels:
        app: chess-gateway
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: gateway
        image: ghcr.io/neoromantics/chess:latest
        command: ["./gateway"]
        ports: [{containerPort: 8080}]
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          value: chess-redis:6379
        - name: GAME_SERVICE_URL
          value: http://chess-game-service:80
        # Gateway absorbed the user-service handlers, so it now needs
        # DATABASE_URL for auth + profile reads in addition to
        # JWT_SECRET for signing/verifying tokens.
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_DB}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-db:5432/$(POSTGRES_DB)?sslmode=disable"
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: chess-secrets, key: JWT_SECRET}}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 10
        # Resource requests gate HPA — without them HPA can't compute
        # utilization %. Memory is the binding constraint on gateway
        # pods because of long-lived WS connections (~4KB goroutine
        # stack each).
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-gateway
  annotations:
    # Prometheus discovers any Service with these annotations and scrapes
    # /metrics on the listed port. Wired in cmd/gateway/main.go via the
    # metrics.HTTPMiddleware + metrics.Handler() at /metrics.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: chess-gateway
  ports:
  - port: 80
    targetPort: 8080

# ==============================================================================
# 3. MICROSERVICES FLEET (Unified Platform Image)
# ==============================================================================

---
# chess-user-service was retired in the 6→3 pod consolidation.
# Its handlers now live in the gateway binary (see
# cmd/gateway/user_handlers.go). Anything pointing at /api/auth/*
# or /api/user/* now lands on the gateway directly.
#
# NOTE: kubectl apply does not prune resources removed from a
# manifest. After this commit lands, manually delete the old
# Deployment + Service + HPA:
#   kubectl -n chess delete deploy chess-user-service
#   kubectl -n chess delete svc chess-user-service
#   kubectl -n chess delete hpa chess-user-service-hpa 2>/dev/null

---
# GAME SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-game-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-game-service
  template:
    metadata:
      labels:
        app: chess-game-service
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: game-service
        image: ghcr.io/neoromantics/chess:latest
        command: ["./game-service"]
        ports: [{containerPort: 8080}]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_USER}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_DB}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: chess-secrets, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@chess-db:5432/$(POSTGRES_DB)?sslmode=disable"
        readinessProbe:
          httpGet: {path: /health, port: 8080}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: chess-game-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: chess-game-service
  ports: [{port: 80, targetPort: 8080}]

---
# chess-matchmaker was retired in the 6→3 pod consolidation. The
# pairing loop now runs as a Redis-leader-elected goroutine inside
# game-service. Operator action after this lands:
#   kubectl -n chess delete deploy chess-matchmaker
#   kubectl -n chess delete svc chess-matchmaker
#
---
# chess-rating-updater was retired in the 6→3 pod consolidation. The
# Glicko-2 consumer now runs as a goroutine inside game-service.
# Operator action after this lands:
#   kubectl -n chess delete deploy chess-rating-updater
#   kubectl -n chess delete svc chess-rating-updater
#
---
# ENGINE WORKER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-worker
  template:
    metadata:
      labels:
        app: chess-worker
    spec:
      imagePullSecrets: [{name: ghcr-auth}]
      containers:
      - name: worker
        image: ghcr.io/neoromantics/chess:latest
        command: ["./worker"]
        ports: [{containerPort: 8080}]
        env:
        - name: REDIS_URL
          value: chess-redis:6379
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests: {cpu: 500m, memory: 256Mi}
          limits: {cpu: 1000m, memory: 512Mi}
---
# Worker is a pure stream consumer with no inbound traffic, but it now
# exposes a tiny /health + /metrics HTTP listener for k8s probes and
# Prometheus scrape. Service exists only so the scrape annotations work
# under Prometheus's standard service-discovery rules.
apiVersion: v1
kind: Service
metadata:
  name: chess-worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: chess-worker
  ports: [{port: 80, targetPort: 8080}]

# ==============================================================================
# 4. AUTOSCALING & DISRUPTION
#
# HPAs scale on CPU + memory. The "right" signals for chess workloads are:
#   - chess-gateway:        WebSocket connection count (custom metric)
#   - chess-engine-worker:  engine:requests stream length (KEDA ScaledObject)
# Neither is wired today — getting custom metrics requires the
# Prometheus Adapter; KEDA stream-length scaling requires installing
# KEDA on the cluster. CPU + memory is a fair proxy until those land.
#
# Note on Redis HA: Sentinel-based failover requires multiple nodes.
# This cluster is single-node today (Duke VCM), so all Redis/Sentinel
# pods would share the same fate on node restart. Adding a second node
# is the prerequisite; until then, AOF (already enabled) gives
# durability and that's the meaningful guarantee at this scale.
# ==============================================================================

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chess-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chess-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
  - type: Resource
    resource:
      name: memory
      target: {type: Utilization, averageUtilization: 75}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 1, periodSeconds: 60}]

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chess-game-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chess-game-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
  - type: Resource
    resource:
      name: memory
      target: {type: Utilization, averageUtilization: 75}

---
# Engine worker scales on CPU because each search pegs its core; high
# average CPU means the queue is being chased and we need more pods.
# Once KEDA is installed, switch this to a ScaledObject with
# trigger.type=redis-streams + streamName=engine:requests for direct
# queue-depth scaling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chess-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chess-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15  # tournament starts surge fast
      policies: [{type: Percent, value: 100, periodSeconds: 15}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 1, periodSeconds: 60}]

---
# PodDisruptionBudgets prevent kubectl drain (or HPA scale-down) from
# emptying a deployment all at once. minAvailable: 1 keeps at least
# one pod up through any voluntary disruption.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chess-gateway-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chess-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chess-game-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chess-game-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chess-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chess-worker
