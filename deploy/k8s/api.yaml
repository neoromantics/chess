apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-api
  labels:
    app: chess-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chess-api
  template:
    metadata:
      labels:
        app: chess-api
    spec:
      containers:
      - name: api
        image: neoromantics/chess-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: database-url
        - name: REDIS_URL
          value: "chess-redis:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chess-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: chess-api
spec:
  selector:
    app: chess-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
