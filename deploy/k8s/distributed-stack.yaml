apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-worker
spec:
  replicas: 10 # Scale up the heavy calculation nodes independently
  selector:
    matchLabels:
      app: chess-worker
  template:
    metadata:
      labels:
        app: chess-worker
    spec:
      containers:
      - name: worker
        image: neoromantics/chess-worker:latest
        env:
        - name: REDIS_URL
          value: "chess-redis:6379"
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "1000m" # Allow full core usage for intensive engine search
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-redis
  template:
    metadata:
      labels:
        app: chess-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: chess-redis
spec:
  selector:
    app: chess-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chess-db
spec:
  serviceName: "chess-db"
  replicas: 1
  selector:
    matchLabels:
      app: chess-db
  template:
    metadata:
      labels:
        app: chess-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: chess
        - name: POSTGRES_PASSWORD
          value: chess
        - name: POSTGRES_DB
          value: chess
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: chess-db
spec:
  selector:
    app: chess-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
