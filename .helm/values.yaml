# Default values for neoromantics-chess.
# This is a YAML-formatted file.

api:
  replicaCount: 3
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 5
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 256Mi

redis:
  image: redis:7-alpine
  port: 6379

postgres:
  image: postgres:16-alpine
  user: chess
  password: chess
  db: chess
  port: 5432

secrets:
  jwtSecret: "change-me-in-production"
  databaseUrl: "postgres://chess:chess@chess-db:5432/chess?sslmode=disable"
