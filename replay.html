<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chess replay</title>
<style>
  :root { --sq: 88px; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #1e1e1e; color: #ddd; margin: 0; padding: 32px 20px; display: flex; gap: 32px; align-items: flex-start; justify-content: center; min-height: 100vh; }
  #board-wrap { display: inline-block; border: 4px solid #333; }
  #board { display: grid; grid-template-columns: repeat(8, var(--sq)); grid-template-rows: repeat(8, var(--sq)); }
  .sq { width: var(--sq); height: var(--sq); display: flex; align-items: center; justify-content: center; font-size: calc(var(--sq) * 0.78); user-select: none; line-height: 1; }
  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }
  .last  { background: #cdd26a !important; }
  .white-piece { color: #fff; text-shadow: 0 0 1px #000, 0 0 2px #000, 1px 1px 1px #000; }
  .black-piece { color: #000; }
  #side { width: 320px; }
  h2 { margin: 0 0 12px; }
  #status { padding: 10px; background: #2b2b2b; border-radius: 4px; min-height: 22px; font-weight: 600; margin-bottom: 12px; }
  .controls { display: flex; gap: 6px; align-items: center; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 8px 12px; border-radius: 3px; font: inherit; cursor: pointer; }
  button:hover { background: #404040; }
  button:disabled { opacity: 0.4; cursor: default; }
  #play { width: 56px; }
  .speed { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .speed input { flex: 1; }
  #moves { font-family: ui-monospace, Menlo, monospace; font-size: 13px; max-height: 380px; overflow-y: auto; background: #2b2b2b; padding: 8px; border-radius: 3px; margin-top: 12px; }
  #moves .move { display: inline-block; padding: 0 4px; cursor: pointer; border-radius: 2px; }
  #moves .move:hover { background: #444; }
  #moves .move.cur { background: #4a6b8a; color: #fff; }
  .row-line { line-height: 1.6; }
  .coords-files, .coords-ranks { color: #888; font-size: 12px; user-select: none; }
  .coords-files { display: grid; grid-template-columns: repeat(8, var(--sq)); padding-left: 22px; }
  .coords-files div { text-align: center; padding: 4px 0; }
  .board-row { display: flex; align-items: center; }
  .coords-ranks { display: grid; grid-template-rows: repeat(8, var(--sq)); width: 22px; }
  .coords-ranks div { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div id="board-wrap">
    <div class="board-row">
      <div class="coords-ranks" id="ranks"></div>
      <div id="board"></div>
    </div>
    <div class="coords-files" id="files"></div>
  </div>

  <div id="side">
    <h2>Replay</h2>
    <div id="status">…</div>
    <div class="controls">
      <button id="first" title="Go to start">⏮</button>
      <button id="prev"  title="Previous">◀</button>
      <button id="play"  title="Play / Pause">▶</button>
      <button id="next"  title="Next">▶</button>
      <button id="last"  title="Go to end">⏭</button>
      <button id="flip"  title="Flip board (F)" style="margin-left:8px;">Flip</button>
    </div>
    <div class="speed">
      <span>Speed</span>
      <input id="speed" type="range" min="150" max="3000" value="800" step="50">
      <span id="speed-label">800ms</span>
    </div>
    <div id="moves"></div>
  </div>

<script id="replay-data" type="application/json">REPLAY_DATA_PLACEHOLDER</script>
<script>
const PIECE = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',
               k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

let FRAMES;
try {
  FRAMES = JSON.parse(document.getElementById('replay-data').textContent);
  if (!Array.isArray(FRAMES) || FRAMES.length === 0) throw new Error('empty');
} catch (e) {
  FRAMES = [{ fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' }];
}

let idx = 0;
let timer = null;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const movesEl = document.getElementById('moves');
const playBtn = document.getElementById('play');
const speedEl = document.getElementById('speed');
const speedLabel = document.getElementById('speed-label');

let flipped = localStorage.getItem('chess-flipped') === '1';

function buildCoords(){
  const f = document.getElementById('files');
  f.innerHTML = '';
  const fileChars = flipped ? 'hgfedcba' : 'abcdefgh';
  for (const c of fileChars) { const d = document.createElement('div'); d.textContent = c; f.appendChild(d); }
  const r = document.getElementById('ranks');
  r.innerHTML = '';
  const rankNums = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  for (const n of rankNums) { const d = document.createElement('div'); d.textContent = n; r.appendChild(d); }
}
buildCoords();

function parseBoard(fen) {
  const rows = fen.split(' ')[0].split('/');
  const grid = [];
  for (const row of rows) {
    const arr = [];
    for (const ch of row) {
      if (ch >= '1' && ch <= '8') for (let i = 0; i < +ch; i++) arr.push(null);
      else arr.push(ch);
    }
    grid.push(arr);
  }
  return grid;
}

function render() {
  const frame = FRAMES[idx];
  const grid = parseBoard(frame.fen);
  boardEl.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      const r = flipped ? 7 - i : i;
      const f = flipped ? 7 - j : j;
      const sq = document.createElement('div');
      const dark = (r + f) % 2 === 1;
      sq.className = 'sq ' + (dark ? 'dark' : 'light');
      const fileChar = String.fromCharCode(97+f);
      const rankChar = String.fromCharCode(49+(7-r));
      const name = fileChar + rankChar;
      const pc = grid[r][f];
      if (pc) {
        const span = document.createElement('span');
        span.textContent = PIECE[pc];
        span.className = (pc === pc.toUpperCase()) ? 'white-piece' : 'black-piece';
        sq.appendChild(span);
      }
      if (frame.from === name || frame.to === name) sq.classList.add('last');
      boardEl.appendChild(sq);
    }
  }
  let label = idx === 0 ? 'Start position' : `Move ${idx}: ${frame.san || ''}`;
  if (idx === FRAMES.length - 1 && idx > 0) label += '  (end)';
  statusEl.textContent = label;
  // Move list highlight
  for (const el of movesEl.querySelectorAll('.move')) {
    el.classList.toggle('cur', +el.dataset.idx === idx);
  }
}

function buildMovesList() {
  movesEl.innerHTML = '';
  // Pair moves: 1. white-move black-move
  for (let i = 1; i < FRAMES.length; i += 2) {
    const line = document.createElement('div');
    line.className = 'row-line';
    const num = ((i-1)/2) + 1;
    line.appendChild(document.createTextNode(num + '. '));
    line.appendChild(makeMoveEl(i));
    if (i + 1 < FRAMES.length) { line.appendChild(document.createTextNode(' ')); line.appendChild(makeMoveEl(i+1)); }
    movesEl.appendChild(line);
  }
}
function makeMoveEl(i) {
  const el = document.createElement('span');
  el.className = 'move';
  el.dataset.idx = i;
  el.textContent = FRAMES[i].san || '?';
  el.onclick = () => { stop(); idx = i; render(); };
  return el;
}

function stop() {
  if (timer) { clearTimeout(timer); timer = null; }
  playBtn.textContent = '▶';
}
function tick() {
  if (idx >= FRAMES.length - 1) { stop(); return; }
  idx++;
  render();
  timer = setTimeout(tick, +speedEl.value);
}
function play() {
  if (idx >= FRAMES.length - 1) idx = 0;
  playBtn.textContent = '⏸';
  tick();
}

function toggleFlip() {
  flipped = !flipped;
  try { localStorage.setItem('chess-flipped', flipped ? '1' : '0'); } catch (_) {}
  buildCoords();
  render();
}
document.getElementById('flip').onclick = toggleFlip;
document.getElementById('first').onclick = () => { stop(); idx = 0; render(); };
document.getElementById('prev').onclick  = () => { stop(); if (idx > 0) idx--; render(); };
document.getElementById('next').onclick  = () => { stop(); if (idx < FRAMES.length - 1) idx++; render(); };
document.getElementById('last').onclick  = () => { stop(); idx = FRAMES.length - 1; render(); };
playBtn.onclick = () => {
  if (timer) stop();
  else play();
};
speedEl.oninput = () => { speedLabel.textContent = speedEl.value + 'ms'; };
speedLabel.textContent = speedEl.value + 'ms';

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  { stop(); if (idx > 0) idx--; render(); }
  else if (e.key === 'ArrowRight') { stop(); if (idx < FRAMES.length - 1) idx++; render(); }
  else if (e.key === ' ')      { e.preventDefault(); if (timer) stop(); else play(); }
  else if (e.key === 'Home')   { stop(); idx = 0; render(); }
  else if (e.key === 'End')    { stop(); idx = FRAMES.length - 1; render(); }
  else if (e.key === 'f' || e.key === 'F') toggleFlip();
});

buildMovesList();
render();
// Auto-play after a short pause so the viewer sees the start position first.
if (FRAMES.length > 1) setTimeout(play, 600);
</script>
</body>
</html>
