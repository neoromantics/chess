name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # --- Backend Validation ---
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'just fmt' locally."
            gofmt -d .
            exit 1
          fi

      - name: Prepare Dummy Frontend
        run: |
          mkdir -p cmd/gateway/dist
          touch cmd/gateway/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./pkg/...

      - name: Build All Services
        run: |
          go build -o /dev/null ./cmd/gateway
          go build -o /dev/null ./cmd/user
          go build -o /dev/null ./cmd/game
          go build -o /dev/null ./cmd/matchmaker
          go build -o /dev/null ./cmd/rating-updater
          go build -o chess-worker ./cmd/engine-worker

      - name: Smoke Test (UCI Worker)
        run: |
          out=$(printf 'uci\nposition startpos\ngo depth 4\nquit\n' | ./chess-worker -uci)
          echo "$out"
          echo "$out" | grep -q '^bestmove '

  # --- Frontend Validation ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Type check
        run: cd frontend && npm run build:main && npm run build:replay

  # --- Container Build & Push ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only push images on main branch (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gateway-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/gateway:latest
            ghcr.io/neoromantics/chess/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push User Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: user-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/user-service:latest
            ghcr.io/neoromantics/chess/user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Game Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: game-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/game-service:latest
            ghcr.io/neoromantics/chess/game-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Matchmaker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: matchmaker-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/matchmaker:latest
            ghcr.io/neoromantics/chess/matchmaker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Rating Updater image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: rating-updater-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/rating-updater:latest
            ghcr.io/neoromantics/chess/rating-updater:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker-runtime
          push: true
          tags: |
            ghcr.io/neoromantics/chess/worker:latest
            ghcr.io/neoromantics/chess/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Secure Deployment (Self-Hosted Runner) ---
  deploy:
    runs-on: self-hosted
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Local k3s
        run: |
          # 1. Clean slate: Delete old deployments to avoid label/pod drift
          kubectl delete deployment --all -n chess || true
          
          # 2. Recreate .env for Kustomize
          echo "${{ secrets.PROD_ENV_FILE }}" > .env
          if [ ! -s .env ]; then echo "Error: PROD_ENV_FILE secret is empty"; exit 1; fi
          
          # 3. Render and apply manifests using the runner's local kubectl
          kubectl kustomize infra --load-restrictor LoadRestrictionsNone | kubectl apply -f -

          
          # 3. Force rollout restart
          kubectl rollout restart deployment chess-gateway chess-user-service chess-game-service chess-matchmaker chess-rating-updater chess-worker -n chess

