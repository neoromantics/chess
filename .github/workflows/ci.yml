name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

# Silence the Sept-2026 Node-20 deprecation warning that fires on every
# checkout/setup-node@v4 step. Forcing Node 24 today matches what those
# actions will default to anyway after June 2026; opt-out lever still
# available via ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION if needed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --- Backend Validation ---
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'gofmt -w .' locally."
            gofmt -d .
            exit 1
          fi

      - name: Prepare Dummy Frontend
        run: |
          mkdir -p cmd/gateway/dist
          touch cmd/gateway/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./pkg/...

      - name: Build All Services
        run: |
          go build -o /dev/null ./cmd/gateway
          go build -o /dev/null ./cmd/game
          go build -o chess-worker ./cmd/engine-worker

      - name: Smoke Test (UCI Worker)
        run: |
          out=$(printf 'uci\nposition startpos\ngo depth 4\nquit\n' | ./chess-worker -uci)
          echo "$out"
          echo "$out" | grep -q '^bestmove '

  # --- Frontend Validation ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Type check
        run: cd frontend && npm run build:main && npm run build:replay

  # --- Unified Container Build & Push ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Unified Platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neoromantics/chess:latest
            ghcr.io/neoromantics/chess:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Secure Deployment (Self-Hosted Runner) ---
  # The runner only ships manifests + restarts pods. It never sees any
  # application secrets — chess-secrets is bootstrapped on the VM via
  # infra/bootstrap-secrets.sh and owned by the cluster from then on.
  # To rotate a secret: kubectl edit secret chess-secrets -n chess,
  # then kubectl rollout restart the affected deployments.
  deploy:
    runs-on: self-hosted
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Unified Fleet
        run: |
          kubectl apply -k infra/
          kubectl -n chess rollout restart deployment \
            chess-gateway chess-game-service \
            chess-worker










