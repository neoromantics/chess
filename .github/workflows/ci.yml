name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # --- Backend Validation ---
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'just fmt' locally."
            gofmt -d .
            exit 1
          fi

      - name: Prepare Dummy Frontend
        run: |
          mkdir -p cmd/gateway/dist
          touch cmd/gateway/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./pkg/...

      - name: Build All Services
        run: |
          go build -o /dev/null ./cmd/gateway
          go build -o /dev/null ./cmd/user
          go build -o /dev/null ./cmd/game
          go build -o /dev/null ./cmd/matchmaker
          go build -o /dev/null ./cmd/rating-updater
          go build -o chess-worker ./cmd/engine-worker

      - name: Smoke Test (UCI Worker)
        run: |
          out=$(printf 'uci\nposition startpos\ngo depth 4\nquit\n' | ./chess-worker -uci)
          echo "$out"
          echo "$out" | grep -q '^bestmove '

  # --- Frontend Validation ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Type check
        run: cd frontend && npm run build:main && npm run build:replay

  # --- Unified Container Build & Push ---
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Unified Platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neoromantics/chess:latest
            ghcr.io/neoromantics/chess:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Secure Deployment (Self-Hosted Runner) ---
  deploy:
    runs-on: self-hosted
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Unified Fleet
        run: |
          # 1. Build .env from individual secrets
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          
          # 2. Diagnostic: List keys found (masking values for safety)
          echo "Checking .env structure (keys only):"
          sed 's/=.*$/=******/' .env
          
          # 3. Validate secret contents
          if ! grep -q "POSTGRES_USER=." .env; then
            echo "CRITICAL: POSTGRES_USER is empty or missing from GitHub Secrets!"
            exit 1
          fi
          
          # 4. Selective Cleanup: Remove legacy pods
          kubectl delete deployment chess-api -n chess || true
          kubectl delete deployment worker -n chess || true
          
          # 5. Render and apply manifests
          kubectl kustomize infra --load-restrictor LoadRestrictionsNone | kubectl apply -f -
          
          # 6. Force rollout restart
          kubectl rollout restart deployment chess-gateway chess-user-service chess-game-service chess-matchmaker chess-rating-updater chess-worker -n chess







